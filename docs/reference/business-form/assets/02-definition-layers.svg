<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-label="02-definition-layers.svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8291"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1400" height="810" rx="0" fill="#f7f9fb" stroke="#f7f9fb"/>
<text x="36" y="48" fill="#203344" font-size="27" font-weight="600">02 / 表单定义：字段、控件、布局与发布快照</text>
<text x="36" y="80" fill="#647485" font-size="16" font-weight="400">当前项目的数据职责图。各层有独立身份，不能把“一个输入框”直接等同于“一个数据库字段”。</text>
<rect x="36" y="122" width="405" height="170" rx="10" fill="#edf5f8" stroke="#6594a7"/>
<text x="54" y="152" fill="#225b73" font-size="19" font-weight="600">字段元数据 FormField</text>
<text x="54" y="182" fill="#536273" font-size="16" font-weight="400">field_name / label / field_type</text>
<text x="54" y="207" fill="#536273" font-size="16" font-weight="400">required / default_value / enum_values</text>
<text x="54" y="232" fill="#536273" font-size="16" font-weight="400">validation / ui_config / archived</text>
<text x="54" y="257" fill="#536273" font-size="16" font-weight="400">决定：存什么、基础规则是什么</text>
<rect x="484" y="122" width="405" height="170" rx="10" fill="#edf5f8" stroke="#6594a7"/>
<text x="502" y="152" fill="#225b73" font-size="19" font-weight="600">设计控件 LayoutControl</text>
<text x="502" y="182" fill="#536273" font-size="16" font-weight="400">id / fieldKey / controlType / source</text>
<text x="502" y="207" fill="#536273" font-size="16" font-weight="400">width / presentation / typeSettings</text>
<text x="502" y="232" fill="#536273" font-size="16" font-weight="400">rules / defaultRule / encodingRule</text>
<text x="502" y="257" fill="#536273" font-size="16" font-weight="400">决定：如何填写、呈现和交互</text>
<rect x="932" y="122" width="430" height="170" rx="10" fill="#fff" stroke="#cdd6de"/>
<text x="950" y="152" fill="#233344" font-size="19" font-weight="600">布局关系 LayoutPlacement</text>
<text x="950" y="182" fill="#536273" font-size="16" font-weight="400">parentId / slotId / 数组顺序</text>
<text x="950" y="207" fill="#536273" font-size="16" font-weight="400">container / two-columns / tabs</text>
<text x="950" y="232" fill="#536273" font-size="16" font-weight="400">formLayout ← 运行布局派生</text>
<text x="950" y="257" fill="#536273" font-size="16" font-weight="400">决定：放在哪个容器、按何顺序</text>
<path d="M441 207 L484 207" fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M889 207 L932 207" fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="345" width="405" height="150" rx="10" fill="#fff" stroke="#cdd6de"/>
<text x="54" y="375" fill="#233344" font-size="19" font-weight="600">视图草稿</text>
<text x="54" y="405" fill="#536273" font-size="16" font-weight="400">viewConfigDraft</text>
<text x="54" y="430" fill="#536273" font-size="16" font-weight="400">筛选 / 列表 / 多 Tab / 工具栏</text>
<text x="54" y="455" fill="#536273" font-size="16" font-weight="400">发布时提升为 viewConfig</text>
<rect x="484" y="345" width="405" height="150" rx="10" fill="#fff" stroke="#cdd6de"/>
<text x="502" y="375" fill="#233344" font-size="19" font-weight="600">权限与流程</text>
<text x="502" y="405" fill="#536273" font-size="16" font-weight="400">permissionDesignDraft → 权限发布</text>
<text x="502" y="430" fill="#536273" font-size="16" font-weight="400">workflowDesigner → 流程关联</text>
<text x="502" y="455" fill="#536273" font-size="16" font-weight="400">workflow_bindings → 动作触发</text>
<rect x="932" y="345" width="430" height="150" rx="10" fill="#fff" stroke="#cdd6de"/>
<text x="950" y="375" fill="#233344" font-size="19" font-weight="600">设计配置持久化</text>
<text x="950" y="405" fill="#536273" font-size="16" font-weight="400">Form.config + FormLayout</text>
<text x="950" y="430" fill="#536273" font-size="16" font-weight="400">formDesignerControls / canvasSettings</text>
<text x="950" y="455" fill="#536273" font-size="16" font-weight="400">设计保存涉及多次 HTTP 请求</text>
<path d="M1120 292 L1120 345" fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M238 292 L238 345" fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M686 292 L686 345" fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="235" y="570" width="930" height="135" rx="10" fill="#edf5f8" stroke="#6594a7"/>
<text x="253" y="600" fill="#225b73" font-size="19" font-weight="600">表单发布版本 FormVersion.snapshot</text>
<text x="253" y="630" fill="#536273" font-size="16" font-weight="400">form + fields + layouts + actions + permissions + workflow_bindings</text>
<text x="253" y="655" fill="#536273" font-size="16" font-weight="400">服务端校验 → 提升草稿配置 → 同步权限 → 保存版本；运行页按发布定义渲染</text>
<path d="M238 495 L400 570" fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M686 495 L686 570" fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1120 495 L980 570" fill="none" stroke="#6c8291" stroke-width="2" marker-end="url(#arrow)"/>
<text x="36" y="762" fill="#225b73" font-size="18" font-weight="600">注意：旧开发指南的统一 definition JSON 是从零实现方案；上图才是当前项目的分层结构。</text></g></svg>