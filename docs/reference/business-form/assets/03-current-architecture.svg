<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-label="03-current-architecture.svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c8291"/></marker></defs><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif"><rect x="0" y="0" width="1400" height="920" rx="0" fill="#f7f9fb" stroke="#f7f9fb"/>
<text x="36" y="48" fill="#203344" font-size="27" font-weight="600">03 / 当前表单架构：界面、服务与存储</text>
<text x="36" y="80" fill="#647485" font-size="16" font-weight="400">服务模块在同一个后端应用内；箭头代表调用或数据依赖，不代表独立微服务。</text>
<rect x="36" y="120" width="408" height="145" rx="10" fill="#fff" stroke="#cdd6de"/>
<text x="54" y="150" fill="#233344" font-size="19" font-weight="600">配置入口</text>
<text x="54" y="180" fill="#536273" font-size="16" font-weight="400">应用装配 → FormSettings</text>
<text x="54" y="205" fill="#536273" font-size="16" font-weight="400">字段 / 布局 / 视图 / 流程 / 权限</text>
<text x="54" y="230" fill="#536273" font-size="16" font-weight="400">ComponentPages 可内嵌打开设计器</text>
<rect x="494" y="120" width="408" height="145" rx="10" fill="#fff" stroke="#cdd6de"/>
<text x="512" y="150" fill="#233344" font-size="19" font-weight="600">运行入口</text>
<text x="512" y="180" fill="#536273" font-size="16" font-weight="400">FormPageEntry → 组件页或原业务页</text>
<text x="512" y="205" fill="#536273" font-size="16" font-weight="400">DynamicPage / FormLayout / 控件</text>
<text x="512" y="230" fill="#536273" font-size="16" font-weight="400">列表、填写、附件与业务提交</text>
<rect x="952" y="120" width="410" height="145" rx="10" fill="#fff" stroke="#cdd6de"/>
<text x="970" y="150" fill="#233344" font-size="19" font-weight="600">AI 工具适配器</text>
<text x="970" y="180" fill="#536273" font-size="16" font-weight="400">权限 / 工具白名单 / 确认</text>
<text x="970" y="205" fill="#536273" font-size="16" font-weight="400">表单检查及写入工具</text>
<text x="970" y="230" fill="#536273" font-size="16" font-weight="400">与 HTTP 复用相应业务服务</text>
<rect x="36" y="320" width="866" height="110" rx="10" fill="#fff" stroke="#cdd6de"/>
<text x="54" y="350" fill="#233344" font-size="19" font-weight="600">HTTP API 与请求身份</text>
<text x="54" y="380" fill="#536273" font-size="16" font-weight="400">forms.py / pages / workflow 等路由 → 租户、管理员、运行权限检查</text>
