- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, compaction]
# This platform profile only exposes authenticated business tools through MCP.
# The official SDK-minimal kernel owns the loop and durable session log.
- id: llm-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: pty
  disabled: true
- id: sandbox-policy
  disabled: true
# New sdk-minimal defaults must not expose host files or duplicate compaction.
- id: mcp-resources
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-working-directory
  disabled: true
- id: compaction-basic
  disabled: false
  config:
    auto: !!js process.env.MF_DSH_COMPACTION_ENABLED === 'true'
    thresholdRatio: !!js Number(process.env.MF_DSH_COMPACTION_THRESHOLD_RATIO)
    retainRatio: !!js Number(process.env.MF_DSH_COMPACTION_RETAIN_RATIO)
    headroomTokens: !!js Number(process.env.MF_DSH_COMPACTION_HEADROOM_TOKENS)
    maxTokens: !!js Number(process.env.MF_DSH_COMPACTION_MAX_TOKENS)
- id: image-offload
  disabled: true
- insert:
  - id: platform-llm
    name: '@deepseek-ai/dsh-llm-pi-ai'
    config: !!js JSON.parse(process.env.MF_DSH_PROVIDER_CONFIG)
  - id: platform-tools
    name: '@deepseek-ai/dsh-mcp-client'
    disabled: !!js '!process.env.MF_DSH_BRIDGE_TOKEN'
    config:
      serverName: platform
      transport: streamable-http
      url: !!js process.env.MF_DSH_BRIDGE_URL
      headers:
        Authorization: !!js '`Bearer ${process.env.MF_DSH_BRIDGE_TOKEN}`'
      failOnStartupError: true
      toolCallTimeoutMs: !!js Number(process.env.MF_DSH_TOOL_TIMEOUT_MS ?? 30000)
